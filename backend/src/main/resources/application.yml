server:
  port: 8080

spring:
  application:
    name: equimind

  datasource:
    url: jdbc:postgresql://localhost:5432/equimind
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # Switched to 'validate' in Phase 3.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    user:
      name: ${API_USERNAME:admin}
      password: ${API_PASSWORD:admin_password}

logging:
  level:
    com.equimind: DEBUG
    org.springframework.security: WARN
